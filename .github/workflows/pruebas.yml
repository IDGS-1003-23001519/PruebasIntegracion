name: CI Pruebas de Integracion y Sistema

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Pruebas de Integración
        run: |
          echo "Iniciando pruebas de integración..."
          python test_integration.py

      - name: Ejecutar Pruebas de Sistema
        run: |
          echo "Iniciando pruebas de sistema..."
          python test_system.py